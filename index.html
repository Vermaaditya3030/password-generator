<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VaultKey</title><link rel="stylesheet" href="css/style.css"></head><body><main><h1>🔐 VaultKey</h1><p>Secure Password Generator</p><section><input id="passwordOutput" readonly><button id="generateBtn">Generate</button><button id="copyBtn">Copy</button><p>Strength: <b id="strengthText">—</b></p><div class="bar"><i id="strengthBar"></i></div><small id="entropyText"></small><hr><label>Length <b id="lengthValue">16</b><input id="length" type="range" min="6" max="64" value="16"></label><p><label><input id="lowercase" type="checkbox" checked> Lowercase</label> <label><input id="uppercase" type="checkbox" checked> Uppercase</label> <label><input id="numbers" type="checkbox" checked> Numbers</label> <label><input id="symbols" type="checkbox" checked> Symbols</label></p><p><label><input id="excludeSimilar" type="checkbox"> Exclude similar</label> <label><input id="noAmbiguous" type="checkbox"> Exclude ambiguous symbols</label></p><p id="error"></p></section><section><h2>Recent passwords</h2><button id="clearHistory">Clear</button><div id="history"></div></section></main><script src="js/script.js"></script></body></html>
